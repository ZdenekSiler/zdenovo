# Temporary HTTP-only config used during initial certificate bootstrap.
# Replaced by the HTTPS config once the certificate is issued.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK - certificate bootstrap in progress';
        add_header Content-Type text/plain;
    }
}

# ─── Health check (internal) ─────────────────────────────────────────────────
# Bound to the loopback inside the container, so it is unreachable from outside
# regardless of published ports. Returns 200 directly: no redirect to chase and
# no TLS, which is what broke the old check.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location / {
        return 404;
    }
}
