<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terraform Associate (004) practice</title>
<meta name="description" content="205 practice questions with explanations for the HashiCorp Terraform Associate (004), plus a timed 57-question mock exam.">
<link rel="canonical" href="https://terraform-quiz.zdenovo.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5FA; --panel: #FFFFFF; --ink: #1D1B2E; --muted: #6B6880; --line: #E3E0EE;
    --tf: #7B42BC; --tf-soft: #EFE7F8; --ok: #1E7F52; --ok-soft: #E4F4EB; --bad: #B83A3A; --bad-soft: #FBE7E7; --code: #F0EEF6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--tf); outline-offset: 2px; }

  header { padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
  header .total { color: var(--muted); font-size: 0.9rem; flex: 1; }
  header label { font-size: 0.88rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .layout { display: grid; grid-template-columns: 310px 1fr; min-height: calc(100vh - 62px); }
  nav { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 12px; }
  nav .objective { display: grid; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 12px; margin-bottom: 3px; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; }
  nav .objective:hover { background: var(--bg); }
  nav .objective.active { background: var(--tf-soft); }
  nav .objective .num { color: var(--tf); font-weight: 600; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; }
  nav .objective .name { font-size: 0.93rem; }
  nav .objective .score { color: var(--muted); font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; }
  nav .objective .score.done { color: var(--ok); }
  nav .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  nav .bar i { display: block; height: 100%; width: 0; background: var(--tf); }
  nav .divider { border-top: 1px solid var(--line); margin: 12px 8px; }
  nav .exam { border: 1.5px solid var(--tf); }
  nav .exam .num { font-size: 1rem; }

  main { padding: 28px 40px 60px; max-width: 840px; }
  .section-head { margin-bottom: 18px; }
  .section-head h2 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
  .section-head p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .section-head .weight { color: var(--tf); }

  .qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }
  .qmeta { color: var(--muted); font-size: 0.83rem; margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; display: flex; justify-content: space-between; gap: 12px; }
  .qmeta .timer.warn { color: var(--bad); font-weight: 600; }
  .qtext { font-size: 1.08rem; font-weight: 500; margin: 0 0 16px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px; display: flex; gap: 12px; align-items: flex-start; transition: border-color .12s, background .12s; }
  .opt .key { font-family: 'IBM Plex Mono', monospace; color: var(--muted); flex: 0 0 18px; }
  .opt:hover:not(:disabled) { border-color: var(--tf); background: #fff; }
  .opt:disabled { cursor: default; }
  .opt.selected { border-color: var(--tf); background: var(--tf-soft); }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .key { color: var(--ok); font-weight: 600; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { color: var(--bad); font-weight: 600; }
  .opt.dim { opacity: .55; }

  .feedback { margin-top: 16px; border-radius: 8px; padding: 14px 18px; border-left: 4px solid; }
  .feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
  .feedback .verdict { font-weight: 600; margin: 0 0 6px; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.bad .verdict { color: var(--bad); }
  .feedback p { margin: 0; }

  .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1.5px solid var(--tf); background: var(--tf); color: #fff; border-radius: 8px; padding: 9px 18px; font-weight: 500; }
  .btn:hover { background: #6A36A6; }
  .btn.ghost { background: transparent; color: var(--tf); }
  .btn.ghost:hover { background: var(--tf-soft); }
  .btn.danger { border-color: var(--bad); background: var(--bad); }
  .hint { color: var(--muted); font-size: 0.88rem; }
  .spacer { flex: 1; }

  .summary { text-align: center; padding: 30px 10px 10px; }
  .summary .big { font-size: 3rem; font-weight: 600; color: var(--tf); font-family: 'IBM Plex Mono', monospace; line-height: 1; }
  .summary .big.pass { color: var(--ok); }
  .summary .big.fail { color: var(--bad); }
  .summary p { color: var(--muted); }
  .breakdown { text-align: left; margin: 24px auto 0; max-width: 520px; }
  .breakdown .row { display: grid; grid-template-columns: 1fr 70px 90px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
  .breakdown .row .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .breakdown .row .bar i { display: block; height: 100%; background: var(--tf); }
  .review { text-align: left; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
  .review h3 { font-size: 1rem; margin: 0 0 12px; }
  .review .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .review .item .q { font-weight: 500; margin: 0 0 6px; }
  .review .item .ans { font-size: 0.9rem; margin: 0 0 4px; }
  .review .item .ans .you { color: var(--bad); }
  .review .item .ans .right { color: var(--ok); }
  .review .item .exp { font-size: 0.9rem; color: var(--muted); margin: 0; }
  .intro { padding: 10px 0; }
  .intro ul { margin: 8px 0 18px; padding-left: 20px; color: var(--muted); }
  .intro li { margin: 4px 0; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 6px; padding: 10px; }
    nav .objective { grid-template-columns: 22px 1fr; min-width: 210px; margin: 0; }
    nav .objective .score { grid-column: 2; }
    nav .bar { grid-column: 1 / 3; }
    nav .divider { display: none; }
    main { padding: 20px 16px 40px; }
    .qcard { padding: 18px; }
    .breakdown .row { grid-template-columns: 1fr 60px 70px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Terraform Associate (004) practice</h1>
  <span class="total" id="totalScore"></span>
  <label><input type="checkbox" id="shuffleOpts" checked> Shuffle answers</label>
  <label><input type="checkbox" id="shuffleQs"> Shuffle questions</label>
</header>

<div class="layout">
  <nav id="nav" aria-label="Exam objectives"></nav>
  <main id="main"></main>
</div>

<script>
// Helpers: Q(question, options, correctIndex, explanation) and TF(statement, isTrue, explanation)
const Q  = (q, opts, a, exp) => ({ q, opts, a, exp });
const TF = (q, t, exp) => ({ q, opts: ["True", "False"], a: t ? 0 : 1, exp, tf: true });

const SECTIONS = [
{
  id: 1, name: "Infrastructure as Code concepts",
  blurb: "What Terraform is, why IaC matters, declarative vs imperative, desired state, and how Terraform compares to other tools.",
  questions: [
    Q("Which of the following is <em>not</em> a benefit of Infrastructure as Code that the course lists?",
      ["Version control and auditability", "Consistency and repeatability", "Automation and efficiency", "Eliminating the need to understand the target platform"],
      3, "IaC brings versioning, collaboration, automation, scalability and consistency. The course stresses the opposite of the last option: before using Terraform you must be proficient on the target platform, because Terraform is not magic."),
    Q("Terraform is best described as which kind of tool?",
      ["Imperative: you write the steps to create each resource in order", "Declarative: you describe the desired end state and Terraform works out the steps", "Configuration management: it installs packages and manages files inside servers", "A cloud-specific provisioning service for one provider"],
      1, "Terraform is declarative. You describe what you want (\"an EC2 instance with these properties\"), not the step-by-step how. Configuration management tools like Ansible or Chef are different but complementary."),
    Q("What does the course mean by <em>desired state</em>?",
      ["The contents of the state file after a successful apply", "The resources, properties and relationships written in your Terraform configuration", "The current real-world infrastructure", "The output of terraform plan"],
      1, "Desired state is the blueprint in your .tf files. Terraform compares it with the current state of real-world resources and makes the changes needed to match."),
    Q("Which pair of tools does the course classify as <em>similar</em> to Terraform (infrastructure provisioning tools)?",
      ["Ansible and Chef", "AWS CloudFormation and Azure Bicep", "Docker and Kubernetes", "Jenkins and GitHub Actions"],
      1, "CloudFormation, Bicep and Pulumi are IaC provisioning tools like Terraform. Configuration management tools (Ansible, Chef, Puppet) install packages, manage files and automate routine tasks; they are different but complementary."),
    Q("Which characteristic belongs to configuration management tools rather than to Terraform?",
      ["Declarative language", "Immutable infrastructure", "Installing packages and managing files inside a system", "Modular design"],
      2, "Installing packages, managing files and automating routine tasks on running systems is the job of configuration management tools. Terraform focuses on provisioning and managing infrastructure declaratively with immutable patterns."),
    Q("What are the core components of Terraform named in the course?",
      ["Terraform Core, Providers, Resources, State, Modules", "CLI, Registry, Sentinel, Agents, Workspaces", "Plan, Apply, Destroy, Validate, Format", "HCL, JSON, YAML, Go, Python"],
      0, "The five core components are Terraform Core (the engine), Providers (plugins for platforms), Resources (what you manage), State (the mapping to real objects) and Modules (reusable packages)."),
    Q("What does it mean that Terraform is <em>platform agnostic</em>?",
      ["A single configuration can only target one cloud at a time", "It can manage infrastructure on any cloud platform, data center or API-driven service through providers", "It automatically converts CloudFormation templates into HCL", "It runs only on Linux"],
      1, "Terraform uses one language (HCL) and one workflow for any platform that has a provider: AWS, Azure, GCP, VMware, Kubernetes, GitHub, and so on."),
    Q("Which language is used to write Terraform configuration?",
      ["YAML", "HashiCorp Configuration Language (HCL)", "Go", "Python"],
      1, "Terraform configurations are written in HCL, a declarative, human-readable language also used in other HashiCorp products. JSON is also accepted but HCL is the primary interface."),
    Q("Which statement about immutable infrastructure is correct?",
      ["Resources are patched in place whenever a change is required", "Components are replaced with new versions rather than modified after deployment", "The state file is stored read-only", "Resources can never be destroyed"],
      1, "Immutable infrastructure means you replace rather than modify. Terraform embraces this: when an attribute cannot be updated in place, the plan shows the resource being replaced."),
    Q("The course describes three Terraform editions. Which list matches them?",
      ["Community (CLI), HCP Terraform (SaaS), Terraform Enterprise (self-hosted)", "Free, Pro, Ultimate", "Local, Remote, Hybrid", "Sentinel, OPA, Vault"],
      0, "Terraform Community Edition is command-line based, HCP Terraform is the SaaS platform, and Terraform Enterprise is the self-hosted and managed edition."),
    TF("With Terraform, the network team, cloud ops team and Kubernetes team can each work on a branch and propose infrastructure changes through pull requests, just like application code.",
      true, "Treating infrastructure as code means branching, pull requests and reviews apply to infrastructure changes, improving collaboration and transparency."),
    TF("Because Terraform is declarative, resource order in your .tf files determines the order in which resources are created.",
      false, "Order in the files does not matter. Terraform builds a dependency graph from resource references and decides the creation order (and parallelism) itself."),
    Q("A team wants to quickly spin up identical dev, QA and production environments from one set of code. Which Terraform feature makes that possible?",
      ["Hardcoding different values in three copies of the configuration", "Input variables that parameterize one configuration to produce many unique environments", "Running terraform destroy between environments", "Using a different provider per environment"],
      1, "A single configuration with input variables can produce many environments: larger VMs and multi-database setups for production, smaller ones for development, all from the same code."),
  ]
},
{
  id: 2, name: "Terraform fundamentals",
  blurb: "HCL syntax, block types, providers, the terraform block, version constraints, the lock file, the .terraform directory, and what state is.",
  questions: [
    Q("What is the correct syntax structure of a resource block in HCL?",
      ["<code>resource aws_vpc vpc {}</code>", "<code>resource \"aws_vpc\" \"vpc\" { ... }</code> where the first label is the type and the second is the name", "<code>resource \"vpc\" \"aws_vpc\" { ... }</code> where the first label is the name", "<code>aws_vpc \"vpc\" { ... }</code>"],
      1, "A block has a type (resource), a resource type defined by the provider (aws_vpc), and a user-chosen name (vpc). It is referenced as aws_vpc.vpc."),
    Q("Which character starts a single-line comment in HCL according to the course's style guide?",
      ["<code>//</code> only", "<code>#</code>", "<code>--</code>", "<code>;</code>"],
      1, "The style guide recommends # for single-line and multi-line comments. (// and /* */ also work, but # is the recommended style.) Other style rules: two-space indentation, aligned equals signs, underscores in names."),
    Q("Which file extension must Terraform configuration files use so that Terraform and related tools recognize them?",
      [".hcl", ".tf", ".tfstate", ".terraform"],
      1, "Configuration files use .tf (or .tf.json). terraform.tfstate is the state file and .terraform is the working directory cache."),
    Q("What does <code>terraform fmt</code> do?",
      ["Validates syntax and references", "Rewrites configuration files into the canonical HCL format and style", "Compresses the state file", "Formats plan output as JSON"],
      1, "fmt only reformats code for consistent, readable style. Use -recursive to include subdirectories. Linters and editor extensions complement it with real-time checks."),
    Q("How is a resource referenced elsewhere in the configuration?",
      ["<code>&lt;name&gt;.&lt;type&gt;</code>", "<code>&lt;type&gt;.&lt;name&gt;</code>, for example <code>aws_instance.web</code>", "<code>resource.&lt;type&gt;.&lt;name&gt;</code>", "<code>var.&lt;type&gt;.&lt;name&gt;</code>"],
      1, "Resources are referenced by type and name: aws_lb.public_load_balancer, aws_instance.web. Attributes follow: aws_instance.web.id."),
    Q("What rules apply to resource names?",
      ["They may contain spaces if quoted", "They must start with a letter or underscore and may contain only letters, digits, underscores and dashes; they must be unique per type in a configuration", "They must be globally unique across all Terraform configurations", "They must match the cloud resource's tag Name"],
      1, "Resource names are user-provided strings that must start with a letter or underscore and use only letters, digits, underscores and dashes."),
    Q("What is the purpose of the <code>provider</code> block?",
      ["To define infrastructure resources to create", "To configure a plugin that connects Terraform to an API-driven platform such as AWS, Azure or GitHub", "To store the state file", "To declare reusable variables"],
      1, "Providers are plugins that extend Terraform to talk to cloud platforms, SaaS and other API-supported services. Arguments (region, profile, etc.) are provider-specific and documented on the Terraform Registry."),
    Q("Where does the course recommend supplying provider authentication details such as an Azure client secret?",
      ["Hardcoded in the provider block", "Via environment variables (or roles), not in the configuration file", "In outputs.tf", "In the state file"],
      1, "Authentication arguments should be provided through environment variables or platform roles because hardcoding credentials in .tf files is a security risk and ends up in version control."),
    Q("Where are provider binaries and documentation found?",
      ["Providers live only on your laptop", "Source code is on GitHub; documentation is on the Terraform Registry (registry.terraform.io); the binary is downloaded during init", "Both are on HCP Terraform only", "Providers are compiled into the Terraform binary"],
      1, "Provider code is hosted on GitHub, documentation is on registry.terraform.io, and when declared in configuration the provider is downloaded to the machine running Terraform at init time."),
    Q("What is the difference between a <code>resource</code> block and a <code>data</code> block?",
      ["Data blocks create infrastructure; resource blocks read it", "Resource blocks create, update and delete infrastructure; data blocks only read information about existing resources without creating anything", "They are interchangeable", "Data blocks are only available in HCP Terraform"],
      1, "Data blocks retrieve information (existing VPC, AMI, resource group, Kubernetes namespace) so it can be referenced. They never change infrastructure."),
    Q("How do you reference the CIDR block of a data source declared as <code>data \"aws_vpc\" \"prd\"</code>?",
      ["<code>aws_vpc.prd.cidr_block</code>", "<code>data.aws_vpc.prd.cidr_block</code>", "<code>var.aws_vpc.prd.cidr_block</code>", "<code>prd.cidr_block</code>"],
      1, "Data block attributes are referenced as data.<type>.<name>.<attribute>."),
    Q("Which block sets global settings such as required Terraform version, required providers and backend configuration?",
      ["provider", "terraform", "locals", "module"],
      1, "The terraform block holds required_version, required_providers and the backend block. It ensures consistency across teams and environments."),
    Q("Given <code>required_version = \"~> 1.11.0\"</code>, which Terraform versions are allowed?",
      ["Only exactly 1.11.0", "1.11.x (1.11.0 and any later patch release, but not 1.12)", "Any version greater than or equal to 1.11.0, including 2.0", "Any 1.x version"],
      1, "The ~> (pessimistic) operator allows only the right-most version component to increment, so ~> 1.11.0 permits 1.11.0, 1.11.5, and so on, but not 1.12.0."),
    Q("Given a provider constraint <code>version = \">= 5.77.0\"</code>, what does Terraform install?",
      ["Exactly 5.77.0", "Any AWS provider version greater than or equal to 5.77.0", "The version 5.77.0 or lower", "Nothing; >= is not a valid operator"],
      1, "The >= operator accepts 5.77.0 or any later release. Contrast with \"5.77.0\" (exact) and \"~> 5.77.0\" (5.77.x only)."),
    Q("Why does the course say pinning provider versions matters?",
      ["Because providers cannot be downloaded without a pinned version", "Because a colleague pulling the code could download a newer provider with changed behavior, causing errors or unexpected results", "Because unpinned providers are not encrypted", "Because the Terraform Registry requires it"],
      1, "The scenario shows one team adding a newly released service after downloading the latest GCP provider while another team is on an older one, leading to failures. Version constraints keep everyone consistent."),
    Q("What does the <code>.terraform.lock.hcl</code> file record and what should you do with it?",
      ["The provider versions Terraform selected; commit it to version control so future inits make the same selections", "The state of your resources; keep it out of version control", "Module source code; delete it after each run", "The CLI's credentials; never share it"],
      0, "Every terraform init creates or updates the lock file with the provider selections. The init output itself tells you to include it in version control so Terraform guarantees the same selections next time."),
    Q("What is stored in the <code>.terraform</code> directory?",
      ["The state file and its backups", "Cached provider binaries (.terraform/providers) and downloaded modules (.terraform/modules)", "Your .tfvars files", "The dependency lock file"],
      1, "The working directory's .terraform folder caches providers and modules. It should be in .gitignore and can safely be deleted; terraform init recreates it."),
    TF("The .terraform directory should be committed to version control so teammates get the same providers.",
      false, "Add it to .gitignore. It contains easily recreatable, platform-specific and potentially large files. The lock file, not the .terraform directory, is what guarantees the same provider selections."),
    Q("What does Terraform state do?",
      ["Stores a copy of your .tf files", "Maps the resources in your configuration to real-world infrastructure and tracks metadata such as dependencies and the provider used", "Caches provider binaries", "Records the output of terraform validate"],
      1, "State is a JSON file that acts as a database mapping configuration to real objects, plus metadata for order of operations. Terraform cannot operate without state."),
    Q("By default, where is Terraform state stored and in what format?",
      ["In HCP Terraform as encrypted binary", "In the working directory as a JSON file named terraform.tfstate", "In the .terraform directory as HCL", "In the provider's API"],
      1, "Local state is the default: terraform.tfstate in the current working directory, JSON-formatted. A backend configuration changes where state is stored."),
    TF("Before any operation, Terraform performs a refresh to update state with the real-world infrastructure.",
      true, "plan and apply refresh state first so the comparison between desired and current state is accurate. You can see 'Refreshing state...' lines at the start of plan output."),
    Q("Which of the following is <em>not</em> one of the common Terraform file names listed in the course?",
      ["main.tf", "variables.tf", "providers.tf", "resources.yaml"],
      3, "Common files are main.tf, variables.tf, outputs.tf, providers.tf and terraform.tfvars. Names are conventions, not requirements, and Terraform processes all .tf files in the directory together."),
    Q("Terraform is run in a directory containing <code>network.tf</code>, <code>dns.tf</code> and <code>outputs.tf</code>. How are these files processed?",
      ["Only main.tf is read; the others are ignored", "All .tf files in the working directory are combined and processed together", "Files are processed alphabetically and can conflict", "Only the file passed on the command line is used"],
      1, "Terraform loads every .tf file in the working directory as one configuration. Splitting resources across files is purely for organization."),
    Q("Why does the course recommend using subdirectories to split up Terraform configurations?",
      ["Terraform requires one resource per directory", "To better organize code and reduce the blast radius of changes", "Because state files must be under 1 MB", "To speed up terraform fmt"],
      1, "Terraform only processes the current working directory, so separate directories (each with their own state) limit how much infrastructure a single change or mistake can affect."),
    Q("A single <code>provider \"aws\"</code> block is declared. Which statement is true?",
      ["A separate provider block is needed for each resource type (EC2, S3, EKS)", "That one provider block lets Terraform manage many resource types on that platform", "Provider blocks can only manage one resource each", "The provider block must be repeated in every .tf file"],
      1, "One AWS provider configuration enables EC2 instances, S3 buckets, EKS clusters and every other AWS resource type."),
    Q("Which block type is used to make code reusable by defining values that can be customized for each run?",
      ["output", "variable", "data", "provider"],
      1, "Variable blocks define inputs. Provider blocks connect to platforms, resource blocks create infrastructure, data blocks read existing information, and output blocks display information."),
  ]
},
{
  id: 3, name: "Core Terraform workflow",
  blurb: "init, validate, plan, apply, destroy, saved plans, the resource graph, CLI conventions, environment variables and debugging.",
  questions: [
    Q("What is the official three-stage Terraform workflow?",
      ["Write, Plan, Apply", "Init, Validate, Destroy", "Code, Test, Deploy", "Build, Ship, Run"],
      0, "The workflow is Write (configuration in HCL), Plan (preview) and Apply (make changes), with terraform init preparing the directory in between."),
    Q("What does <code>terraform init</code> do?",
      ["Creates the execution plan", "Sets up the working directory: initializes the backend, downloads providers and modules, and creates or updates the lock file", "Formats the code", "Destroys the previous deployment"],
      1, "init is the first command in a new project. Rerun it whenever you change modules or backend configuration; other commands will remind you if you forget."),
    Q("You must run which command before <code>terraform validate</code> will work?",
      ["terraform apply", "terraform init", "terraform plan", "terraform fmt"],
      1, "The working directory must be initialized first so Terraform has the providers needed to know each resource's schema."),
    Q("What does <code>terraform validate</code> check?",
      ["Whether the real infrastructure matches the configuration", "That configuration is syntactically valid, structurally sound and references variables and resources correctly, without contacting providers", "That your cloud credentials are valid", "That state is unlocked"],
      1, "validate does not communicate with providers, so it cannot catch every error (for example an invalid AMI ID). It is a fast early check before plan and apply."),
    Q("In plan output, what does <code>~</code> in front of a resource mean?",
      ["Create", "Update in place", "Destroy", "Destroy and then create replacement"],
      1, "Symbols: + create, ~ update in-place, - destroy, -/+ destroy and then create replacement."),

{
  id: 7, name: "Maintaining infrastructure",
  blurb: "Drift (revert vs accept), refresh-only mode, refactoring with moved, removed and import blocks, and the legacy terraform import command.",
  questions: [
    Q("What is infrastructure drift?",
      ["A version mismatch between CLI and provider", "A difference between real infrastructure and what Terraform's state/configuration expects, caused by changes made outside Terraform", "Growth of the state file", "Provider deprecation warnings"],
      1, "Example: someone changes a VM in the Azure portal. Terraform detects drift when it refreshes state during plan."),
    Q("A change was made manually in the cloud console and it was a mistake. According to the course, how do you revert it?",
      ["terraform apply -refresh-only", "A regular terraform apply, because your configuration (desired state) hasn't changed", "terraform state rm", "terraform import"],
      1, "Revert: your .tf files are the source of truth, so a normal apply overwrites the real-world change. Accept: use refresh-only mode."),
    Q("A manual change is valid and you want to keep it. How do you make Terraform's state reflect it without changing infrastructure?",
      ["terraform apply -refresh-only", "terraform apply", "terraform destroy -target", "terraform validate"],
      0, "Refresh-only mode reconciles state with the drifted remote objects. terraform plan -refresh-only previews; terraform apply -refresh-only actually updates state."),
    Q("What is the difference between <code>terraform plan -refresh-only</code> and <code>terraform apply -refresh-only</code>?",
      ["They are identical", "plan -refresh-only previews what would change in state and makes no changes; apply -refresh-only actually updates the state file", "plan -refresh-only changes infrastructure", "apply -refresh-only destroys drifted resources"],
      1, "Use plan to investigate drift safely, then apply after you've reviewed and decided to accept it."),
    Q("What is state refactoring?",
      ["Rewriting the state file by hand", "Reorganizing how Terraform tracks infrastructure (renames, moving into modules, adopting or releasing resources) without changing the infrastructure itself", "Migrating to a new backend", "Deleting unused providers"],
      1, "Without refactoring tools, Terraform thinks a renamed resource is a destroy plus a create."),
    Q("You rename <code>resource \"aws_vpc\" \"vpc\"</code> to <code>\"sbx_vpc\"</code> and run plan. What does Terraform show without a moved block?",
      ["An in-place update", "1 to add, 1 to destroy: it plans to destroy aws_vpc.vpc and create aws_vpc.sbx_vpc", "No changes", "A refresh-only change"],
      1, "Terraform matches configuration to state by address, so a new name looks like a brand new resource and the old one is 'not in configuration'."),
    Q("Which block prevents the destroy/recreate when renaming a resource?",
      ["<code>moved { from = aws_instance.server  to = aws_instance.web_server }</code>", "<code>removed { from = aws_instance.server }</code>", "<code>import { to = aws_instance.web_server }</code>", "<code>lifecycle { prevent_destroy = true }</code>"],
      0, "The moved block tells Terraform the resource has a new address; state is updated during plan/apply without touching real infrastructure."),
    Q("Which moved block moves a resource into a module?",
      ["<code>moved { from = aws_s3_bucket.data  to = module.storage.aws_s3_bucket.data }</code>", "<code>moved { from = module.storage  to = aws_s3_bucket.data }</code>", "<code>import { to = module.storage.aws_s3_bucket.data }</code>", "<code>removed { from = aws_s3_bucket.data }</code>"],
      0, "from is where the original resource block lived, to is the new address. Whole modules can be moved too: from = module.old_app, to = module.new_app."),
    Q("What is the full refactoring workflow for a moved block described in the course?",
      ["Add moved block, apply, done", "Add the new resource blocks, add moved blocks, plan (validate), apply (updates state), then delete the moved blocks", "Delete the old resource, apply, re-import", "Run terraform state mv, then commit"],
      1, "After the state update has been applied, the moved blocks have done their job and can be removed."),
    Q("The DBA team wants to take over a database that Terraform created, keeping it running. What should you do?",
      ["Delete the resource block and apply", "Add a <code>removed</code> block with <code>lifecycle { destroy = false }</code> and remove the resource block from the configuration", "Add prevent_destroy", "Run terraform destroy -target"],
      1, "Simply deleting the resource block would DELETE the database. The removed block removes it from state while leaving the real resource intact."),
    TF("When using a removed block, you must also delete the resource block from your configuration.",
      true, "The removed block replaces the resource block; it instructs Terraform to stop managing the object (and with destroy = false, to keep it running)."),
    Q("According to the course's decision tree, which block do you use when reorganizing resources into modules?",
      ["removed", "moved", "import", "check"],
      1, "Renaming or reorganizing into modules → moved. Stopping management, handing off to another team, or splitting configurations → removed."),
    Q("Which block is used when splitting one configuration into two?",
      ["moved", "removed (in the old configuration) followed by import (in the new one)", "check", "data"],
      1, "The decision tree lists splitting configurations under removed; the new configuration then adopts the resources with import blocks."),
    Q("What does the <code>import</code> block do?",
      ["Downloads a module", "Brings existing infrastructure under Terraform management by mapping a real-world ID to a resource address", "Imports variables from another workspace", "Loads a saved plan"],
      1, "Example: import { to = azurerm_resource_group.prd-rg  id = \"/subscriptions/1234/rg/my-rg\" }. to is the resource block address, id is the real resource identifier."),
    Q("What must exist before an import block can be applied?",
      ["A moved block", "A resource block that will manage the imported resource, written manually or generated with <code>terraform plan -generate-config-out=PATH</code>", "A removed block", "An HCP Terraform workspace"],
      1, "Terraform needs the target resource block. -generate-config-out writes a starting configuration for you."),
    Q("How does the legacy <code>terraform import</code> command differ from the import block?",
      ["It generates configuration automatically", "It modifies state immediately with no plan step and still requires you to write the resource block manually first", "It works without a resource block", "It is the recommended approach for 004"],
      1, "Syntax: terraform import aws_instance.web i-1234567890abcdef0. For the exam, know it exists but focus on the import block."),
    Q("Why does the course prefer configuration blocks (moved, removed, import) over CLI state commands?",
      ["CLI commands are slower", "Blocks are declared in .tf files, version-controlled, reviewable in PRs, part of the normal plan/apply workflow and can be tested before applying", "CLI commands are no longer installed", "Blocks encrypt state"],
      1, "CLI commands run outside the configuration, aren't version-controlled, are hard to review and risky: one wrong command permanently modifies state."),
    Q("Which is the current recommended way to force replacement of a specific resource on the next apply?",
      ["terraform taint", "terraform apply -replace=ADDRESS", "terraform state rm then apply", "Comment out the resource and apply twice"],

    Q("What is the workflow for applying a removed block?",
      ["Apply first, then add the block", "Add the removed block(s), remove the resource block(s), plan, apply (updates state), then delete the removed block(s)", "Only run terraform state rm", "Run terraform destroy"],
      1, "Like moved blocks, removed blocks are temporary refactoring instructions and are deleted after the state update is applied."),
  ]
},

    TF("With HCP Terraform, you can start with just remote state storage and adopt other features over time.",
      true, "Adopt at your own pace: keep local execution if you want, or switch to remote when ready. It scales from solo practitioners to large teams."),
    Q("Which HCP Terraform feature estimates the cost of a change before apply?",
      ["Health assessments", "Cost estimation", "Run triggers", "Change requests"],
      1, "Cost estimation is part of the governance features, and Sentinel policies can use its data."),
  ]
}
];


// ---------- State ----------
const EXAM_SIZE = 57, EXAM_MINUTES = 60, PASS_PCT = 70;
const KEYS = ['A','B','C','D','E'];
const progress = SECTIONS.map(s => freshProgress(s.questions.length));
let current = 0;                    // index into SECTIONS, or 'exam'
let exam = null;                    // { items:[{s,qi,order}], idx, answers:[], deadline, finished }
let timerHandle = null;

function freshProgress(n) { return { idx: 0, answers: Array(n).fill(null), order: [...Array(n).keys()], optOrder: Array(n).fill(null) }; }
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function optionOrder(q, slot) {
  if (slot.optOrder) return slot.optOrder;
  const base = [...Array(q.opts.length).keys()];
  slot.optOrder = (document.getElementById('shuffleOpts').checked && !q.tf) ? shuffle(base) : base;
  return slot.optOrder;
}

const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');
const totalEl = document.getElementById('totalScore');
document.getElementById('shuffleQs').onchange = e => {
  progress.forEach((p, i) => { if (p.answers.every(a => a === null)) p.order = e.target.checked ? shuffle(p.order) : [...Array(SECTIONS[i].questions.length).keys()]; });
  if (current !== 'exam') render();
};

// ---------- Nav ----------
function renderNav() {
  navEl.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const p = progress[i];
    const answered = p.answers.filter(a => a !== null).length;
    const correct = p.answers.filter((a, qi) => a === s.questions[qi].a).length;
    const btn = document.createElement('button');
    btn.className = 'objective' + (current === i ? ' active' : '');
    btn.innerHTML = `<span class="num">${s.id}</span><span class="name">${s.name}</span>
      <span class="score ${answered === s.questions.length ? 'done' : ''}">${answered ? correct + '/' + answered : s.questions.length + ' q'}</span>
      <span class="bar"><i style="width:${(answered / s.questions.length) * 100}%"></i></span>`;
    btn.onclick = () => { current = i; render(); };
    navEl.appendChild(btn);
  });
  const div = document.createElement('div'); div.className = 'divider'; navEl.appendChild(div);
  const ex = document.createElement('button');
  ex.className = 'objective exam' + (current === 'exam' ? ' active' : '');
  ex.innerHTML = `<span class="num">⏱</span><span class="name">Mock exam</span><span class="score">${EXAM_SIZE} q · ${EXAM_MINUTES} min</span>`;
  ex.onclick = () => { current = 'exam'; render(); };
  navEl.appendChild(ex);

  const all = progress.flatMap((p, i) => p.answers.map((a, qi) => a === null ? null : a === SECTIONS[i].questions[qi].a));
  const done = all.filter(a => a !== null).length, ok = all.filter(a => a === true).length;
  totalEl.textContent = done ? `Practice: ${ok} of ${done} correct` : `${all.length} practice questions across 8 objectives`;
}

// ---------- Render ----------
function render() {
  renderNav();
  mainEl.innerHTML = '';
  if (current === 'exam') return renderExam();
  const s = SECTIONS[current], p = progress[current];

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `<h2><span class="weight">${s.id}.</span> ${s.name}</h2><p>${s.blurb}</p>`;
  mainEl.appendChild(head);

  const card = document.createElement('div'); card.className = 'qcard'; mainEl.appendChild(card);
  if (p.idx >= s.questions.length) return renderSectionSummary(card, s, p);

  const qi = p.order[p.idx], q = s.questions[qi], chosen = p.answers[qi];
  const slot = { get optOrder() { return p.optOrder[qi]; }, set optOrder(v) { p.optOrder[qi] = v; } };
  const order = optionOrder(q, slot);

  card.innerHTML = `<div class="qmeta"><span>Question ${p.idx + 1} of ${s.questions.length}${q.tf ? ' · true or false' : ''}</span></div><p class="qtext">${q.q}</p>`;
  const opts = document.createElement('div'); opts.className = 'options';
  order.forEach((oi, pos) => {
    const b = document.createElement('button'); b.className = 'opt';
    b.innerHTML = `<span class="key">${KEYS[pos]}</span><span>${q.opts[oi]}</span>`;
    if (chosen !== null) {
      b.disabled = true;
      b.classList.add(oi === q.a ? 'correct' : oi === chosen ? 'wrong' : 'dim');
    } else b.onclick = () => { p.answers[qi] = oi; render(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);

  const actions = document.createElement('div'); actions.className = 'actions';
  if (chosen !== null) {
    const right = chosen === q.a, fb = document.createElement('div');
    fb.className = 'feedback ' + (right ? 'ok' : 'bad'); fb.setAttribute('role', 'status');
    fb.innerHTML = `<p class="verdict">${right ? 'Correct.' : 'Not quite. The correct answer is ' + KEYS[order.indexOf(q.a)] + '.'}</p><p>${q.exp}</p>`;
    card.appendChild(fb);
    const next = document.createElement('button'); next.className = 'btn';
    next.textContent = p.idx + 1 < s.questions.length ? 'Next question' : 'See section results';
    next.onclick = () => { p.idx++; render(); };
    actions.appendChild(next);
    setTimeout(() => next.focus(), 0);
  } else {
    const hint = document.createElement('span'); hint.className = 'hint';
    hint.textContent = 'Pick an answer. A wrong pick shows the correct one with an explanation.';
    actions.appendChild(hint);
  }
  if (p.idx > 0) { const back = document.createElement('button'); back.className = 'btn ghost'; back.textContent = 'Previous'; back.onclick = () => { p.idx--; render(); }; actions.appendChild(back); }
  card.appendChild(actions);
}

function renderSectionSummary(card, s, p) {
  const correct = p.answers.filter((a, qi) => a === s.questions[qi].a).length;
  const missed = p.order.map(qi => ({ q: s.questions[qi], qi })).filter(({ q, qi }) => p.answers[qi] !== q.a);
  card.innerHTML = `<div class="summary">
      <div class="big">${correct}/${s.questions.length}</div>
      <p>${correct === s.questions.length ? 'Every question right in this objective.' : 'Review what you missed below, then retry the section.'}</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="retry">Retry this section</button>
        ${current + 1 < SECTIONS.length ? '<button class="btn ghost" id="nextSec">Go to objective ' + (current + 2) + '</button>' : ''}
      </div>
      ${missed.length ? `<div class="review"><h3>Missed questions (${missed.length})</h3>${missed.map(({ q, qi }) => reviewItem(q, p.answers[qi])).join('')}</div>` : ''}
    </div>`;
  card.querySelector('#retry').onclick = () => { progress[current] = freshProgress(s.questions.length); if (document.getElementById('shuffleQs').checked) progress[current].order = shuffle(progress[current].order); render(); };
  const ns = card.querySelector('#nextSec'); if (ns) ns.onclick = () => { current++; render(); };
}

function reviewItem(q, chosen) {
  return `<div class="item"><p class="q">${q.q}</p>
    ${chosen === null ? '<p class="ans"><span class="you">Not answered</span></p>' : `<p class="ans"><span class="you">Your answer:</span> ${q.opts[chosen]}</p>`}
    <p class="ans"><span class="right">Correct:</span> ${q.opts[q.a]}</p><p class="exp">${q.exp}</p></div>`;
}

// ---------- Mock exam ----------
function buildExam() {
  // Weight roughly like the real exam: draw proportionally from each objective, then top up randomly.
  const total = SECTIONS.reduce((n, s) => n + s.questions.length, 0);
  let items = [];
  SECTIONS.forEach((s, si) => {
    const take = Math.max(3, Math.round(EXAM_SIZE * s.questions.length / total));
    shuffle([...Array(s.questions.length).keys()]).slice(0, take).forEach(qi => items.push({ s: si, qi }));
  });
  items = shuffle(items).slice(0, EXAM_SIZE);
  items.forEach(it => { const q = SECTIONS[it.s].questions[it.qi]; const base = [...Array(q.opts.length).keys()]; it.order = (document.getElementById('shuffleOpts').checked && !q.tf) ? shuffle(base) : base; });
  return { items, idx: 0, answers: Array(items.length).fill(null), deadline: Date.now() + EXAM_MINUTES * 60000, finished: false };
}
function fmtTime(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

function renderExam() {
  const head = document.createElement('div'); head.className = 'section-head';
  head.innerHTML = `<h2><span class="weight">⏱</span> Mock exam</h2><p>${EXAM_SIZE} questions drawn across all objectives, ${EXAM_MINUTES} minutes, answers revealed at the end. Pass mark used here: ${PASS_PCT}%.</p>`;
  mainEl.appendChild(head);
  const card = document.createElement('div'); card.className = 'qcard'; mainEl.appendChild(card);

  if (!exam) {
    card.innerHTML = `<div class="intro"><p>This simulates exam conditions: no feedback until you finish, a countdown, and a per-objective breakdown at the end. You can move back and forth between questions and change answers before finishing.</p>
      <ul><li>Real exam: about 57 questions in 60 minutes, single- and multiple-choice plus true/false.</li><li>Questions here are drawn at random from the practice bank, so each attempt is different.</li></ul>
      <button class="btn" id="start">Start mock exam</button></div>`;
    card.querySelector('#start').onclick = () => { exam = buildExam(); stopTimer(); timerHandle = setInterval(tick, 1000); render(); };
    return;
  }
  if (exam.finished) return renderExamResults(card);

  const it = exam.items[exam.idx], q = SECTIONS[it.s].questions[it.qi], chosen = exam.answers[exam.idx];
  card.innerHTML = `<div class="qmeta"><span>Question ${exam.idx + 1} of ${exam.items.length}${q.tf ? ' · true or false' : ''}</span><span class="timer" id="timer">${fmtTime(exam.deadline - Date.now())}</span></div><p class="qtext">${q.q}</p>`;
  const opts = document.createElement('div'); opts.className = 'options';
  it.order.forEach((oi, pos) => {
    const b = document.createElement('button'); b.className = 'opt' + (oi === chosen ? ' selected' : '');
    b.innerHTML = `<span class="key">${KEYS[pos]}</span><span>${q.opts[oi]}</span>`;
    b.onclick = () => { exam.answers[exam.idx] = oi; if (exam.idx + 1 < exam.items.length) exam.idx++; render(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);

  const actions = document.createElement('div'); actions.className = 'actions';
  const back = document.createElement('button'); back.className = 'btn ghost'; back.textContent = 'Previous'; back.disabled = exam.idx === 0; back.onclick = () => { exam.idx--; render(); };
  const next = document.createElement('button'); next.className = 'btn ghost'; next.textContent = 'Next'; next.disabled = exam.idx + 1 >= exam.items.length; next.onclick = () => { exam.idx++; render(); };
  const unanswered = exam.answers.filter(a => a === null).length;
  const status = document.createElement('span'); status.className = 'hint'; status.textContent = unanswered ? `${unanswered} unanswered` : 'All answered';
  const finish = document.createElement('button'); finish.className = 'btn'; finish.textContent = 'Finish exam';
  finish.onclick = () => { if (!unanswered || confirm(`${unanswered} question(s) are unanswered and will count as wrong. Finish anyway?`)) finishExam(); };
  const sp = document.createElement('span'); sp.className = 'spacer';
  actions.append(back, next, status, sp, finish);
  card.appendChild(actions);
}

function tick() {
  if (!exam || exam.finished) return stopTimer();
  const left = exam.deadline - Date.now();
  const t = document.getElementById('timer');
  if (t) { t.textContent = fmtTime(left); t.classList.toggle('warn', left < 5 * 60000); }
  if (left <= 0) { finishExam(); alert('Time is up. The exam has been submitted.'); }
}
function finishExam() { exam.finished = true; stopTimer(); if (current === 'exam') render(); }

function renderExamResults(card) {
  const results = exam.items.map((it, i) => ({ it, q: SECTIONS[it.s].questions[it.qi], chosen: exam.answers[i], ok: exam.answers[i] === SECTIONS[it.s].questions[it.qi].a }));
  const correct = results.filter(r => r.ok).length, pct = Math.round(100 * correct / results.length), pass = pct >= PASS_PCT;
  const perSec = SECTIONS.map((s, si) => { const r = results.filter(x => x.it.s === si); return { s, n: r.length, ok: r.filter(x => x.ok).length }; }).filter(x => x.n);
  const missed = results.filter(r => !r.ok);
  card.innerHTML = `<div class="summary">
      <div class="big ${pass ? 'pass' : 'fail'}">${pct}%</div>
      <p>${correct} of ${results.length} correct · ${pass ? 'above' : 'below'} the ${PASS_PCT}% pass mark</p>
      <div class="breakdown">${perSec.map(x => `<div class="row"><span>${x.s.id}. ${x.s.name}</span><span class="bar"><i style="width:${100 * x.ok / x.n}%"></i></span><span style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:.85rem">${x.ok}/${x.n}</span></div>`).join('')}</div>
      <div class="actions" style="justify-content:center;margin-top:22px"><button class="btn" id="again">Take another mock exam</button></div>
      ${missed.length ? `<div class="review"><h3>Missed questions (${missed.length})</h3>${missed.map(r => `<p class="hint" style="margin:0">${SECTIONS[r.it.s].id}. ${SECTIONS[r.it.s].name}</p>` + reviewItem(r.q, r.chosen)).join('')}</div>` : ''}
    </div>`;
  card.querySelector('#again').onclick = () => { exam = null; render(); };
}

// Deep link: terraform-quiz.zdenovo.com/#exam opens straight on the mock exam.
// hashchange too, so the link works from a tab already on the quiz (a fragment
// navigation does not re-run this script).
function applyHash() { if (location.hash === '#exam' && current !== 'exam') { current = 'exam'; render(); } }
window.addEventListener('hashchange', applyHash);
if (location.hash === '#exam') current = 'exam';
render();
</script>
</body>
</html>
